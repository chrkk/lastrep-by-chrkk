spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lastrep_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:yourpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  open-in-view: false

server:
  port: ${PORT:8080}

app:
  jwt-secret: ${JWT_SECRET:lastrep-super-secret-key-change-this-in-production-make-it-long}
  jwt-expiration-ms: 86400000